name: medbills_seed_scripts
description: Standalone Dart CLI tools for seeding the live MedBills Firestore database. Deliberately not a Flutter package (no `flutter` SDK dependency) so it runs with plain `dart run` on any machine with the Dart SDK, independent of the app's own pubspec.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.4.0

dependencies:
  args: ^2.6.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

dev_dependencies:
  lints: ^5.0.0
