name: Build apps

# Builds every platform on real Windows/macOS/Linux machines, runs the checks,
# and publishes the installable results to the "latest-build" release.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MedBills-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-Windows
          path: MedBills-Windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk MedBills-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-Android
          path: MedBills-Android.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Zip
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent MedBills.app "$GITHUB_WORKSPACE/MedBills-macOS-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-macOS-unsigned
          path: MedBills-macOS-unsigned.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Compiles the iPhone app. Installing on a phone needs your Apple ID
      # to sign it (Xcode, or a sideloading tool) — see README.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MedBills-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-iOS-unsigned
          path: MedBills-iOS-unsigned.ipa

  release:
    needs: [checks, windows, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MedBills — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

          - **MedBills-Windows.zip** — unzip anywhere and run \`MedBills.exe\`.
          - **MedBills-Android.apk** — install on an Android phone (allow installs from this source).
          - **MedBills-macOS-unsigned.zip** / **MedBills-iOS-unsigned.ipa** — must be signed with your Apple ID before they run (see README → Apple signing)."
