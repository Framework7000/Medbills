name: Build apps

# Builds every platform on real Windows/macOS/Linux machines, runs the checks,
# and publishes the installable results to the "latest-build" release.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd scripts && dart pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Bundle the Visual C++ runtime next to the app
        shell: pwsh
        run: |
          $dest = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $dest }
          }
          Get-ChildItem $dest -Filter *.dll | Select-Object Name
      - name: Build installer (MedBills-Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\installer\medbills.iss
          Copy-Item dist\MedBills-Setup.exe MedBills-Setup.exe
      # The owner's brother only double-clicks MedBills-Setup.exe, so check
      # exactly that, five times over, on a clean Windows machine: silent
      # install, the app opens and keeps running (screenshot kept as proof),
      # silent uninstall leaves nothing behind.
      - name: Install, open and uninstall MedBills 5 times
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $app = Join-Path $env:LOCALAPPDATA 'Programs\MedBills'
          $exe = Join-Path $app 'MedBills.exe'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "=== Round $i of 5 ==="
            $setup = Start-Process .\MedBills-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=desktopicon' -PassThru -Wait
            if ($setup.ExitCode -ne 0) { throw "Round ${i}: installer exited with $($setup.ExitCode)" }
            if (-not (Test-Path $exe)) { throw "Round ${i}: MedBills.exe was not installed at $exe" }
            $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MedBills.lnk'
            if (-not (Test-Path $shortcut)) { throw "Round ${i}: no desktop icon" }
            $run = Start-Process $exe -PassThru
            Start-Sleep -Seconds 25
            if ($run.HasExited) { throw "Round ${i}: MedBills closed by itself (exit code $($run.ExitCode))" }
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $shot.Save("screenshots\round-$i.png")
            Write-Host "Round ${i}: running after 25 s (memory $([math]::Round($run.WorkingSet64 / 1MB)) MB)"
            Stop-Process -Id $run.Id -Force
            Start-Sleep -Seconds 2
            $un = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
            if ($un.ExitCode -ne 0) { throw "Round ${i}: uninstaller exited with $($un.ExitCode)" }
            # The uninstaller finishes from a temporary copy; give it time.
            for ($w = 0; $w -lt 30 -and (Test-Path $exe); $w++) { Start-Sleep -Seconds 1 }
            if (Test-Path $exe) { throw "Round ${i}: uninstall left MedBills.exe behind" }
            Write-Host "Round ${i}: OK"
          }
          Write-Host "All 5 rounds passed."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-check-screenshots
          path: screenshots
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MedBills-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-Windows
          path: |
            MedBills-Setup.exe
            MedBills-Windows-portable.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk MedBills-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-Android
          path: MedBills-Android.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # No Apple team on GitHub: build the downloadable app without the
      # sandbox/keychain-group entitlements that require one.
      - run: cp macos/Runner/Unsigned.entitlements macos/Runner/Release.entitlements
      - run: flutter build macos --release
      - name: Disk image (drag MedBills to Applications)
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/MedBills.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname MedBills -srcfolder dmg -ov -format UDZO MedBills-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-Mac
          path: MedBills-Mac.dmg

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Compiles the iPhone app. Installing on a phone needs your Apple ID
      # to sign it (Xcode, or a sideloading tool) — see README.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MedBills-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MedBills-iOS-unsigned
          path: MedBills-iOS-unsigned.ipa

  web-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The demo runs on sample data (no Firebase on web by default).
      - run: flutter build web --release
      - name: Self-contained loader and trimmed CanvasKit
        run: |
          python3 - <<'PY'
          p = 'build/web/flutter_bootstrap.js'
          s = open(p).read()
          i = s.index('_flutter.loader.load({')
          s = s[:i] + '_flutter.loader.load({\n  config: {\n    canvasKitBaseUrl: "canvaskit/",\n    canvasKitVariant: "full"\n  }\n});\n'
          open(p, 'w').write(s)
          PY
          cd build/web
          rm -rf canvaskit/chromium canvaskit/skwasm* canvaskit/wimp* canvaskit/*.symbols canvaskit/webparagraph \
            canvaskit/experimental_webparagraph assets/NOTICES .last_build_id flutter_service_worker.js flutter.js.map
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: build/web

  release:
    needs: [checks, windows, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MedBills-*
          merge-multiple: true
      - name: Publish latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MedBills — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

          - **MedBills-Setup.exe** — Windows 10/11 installer. Double-click, press Install. (If Windows shows \"Windows protected your PC\", click More info → Run anyway.)
          - **MedBills-Mac.dmg** — open it and drag MedBills into Applications. First launch: right-click MedBills → Open.
          - **MedBills-Android.apk** — install on an Android phone.
          - **MedBills-iOS-unsigned.ipa** — iPhone: install with Sideloadly using your Apple ID, or use TestFlight (see README).
          - **MedBills-Windows-portable.zip** — the same Windows app without installing (unzip, run MedBills.exe)."
